<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Film Shelf 是个人观影片单，可浏览推荐电影、近日观影记录、电影详情及演员作品。" />
    <meta name="theme-color" content="#fafafa" />
    <style>
      :root { --page-background: #fafafa; background: var(--page-background); color-scheme: light; }
      :root.dark { --page-background: #141416; color-scheme: dark; }
    </style>
    <script>
      try {
        if (localStorage.getItem("film-shelf-theme") === "dark") {
          const root = document.documentElement;
          root.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').content =
            getComputedStyle(root).getPropertyValue("--page-background").trim();
        }
      } catch {}
    </script>
    <title>Film Shelf · 我的片单</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
